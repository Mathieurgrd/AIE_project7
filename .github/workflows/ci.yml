# CI/CD partie 2 — consigne étape 2
# 1) Tests API  2) Build image Docker si OK  3) Déploiement simulé (artifact image)
name: CI API

on:
  push:
    branches: [EDA, main, master]
  pull_request:
    branches: [EDA, main, master]

jobs:
  test:
    name: Pytest API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run API tests
        run: uv run pytest tests/test_api.py -q

  build:
    name: Docker build + smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: credit-scoring-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name api-ci -p 8000:8000 credit-scoring-api:ci
          sleep 3
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8000/model/info | tee /tmp/model_info.json
          grep -q '"threshold_opt_valid":0.52' /tmp/model_info.json
          grep -q '"scoring_backend":"onnx"' /tmp/model_info.json
          docker rm -f api-ci

      - name: Save image for simulated deploy
        run: |
          docker save credit-scoring-api:ci | gzip > credit-scoring-api-ci.tar.gz
          ls -lh credit-scoring-api-ci.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: credit-scoring-api-image
          path: credit-scoring-api-ci.tar.gz
          retention-days: 7

  deploy-simulated:
    name: Deploy simulé
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: credit-scoring-api-image

      - name: Load image and verify
        run: |
          gunzip -c credit-scoring-api-ci.tar.gz | docker load
          docker image inspect credit-scoring-api:ci >/dev/null
          echo "Déploiement simulé OK — image CI disponible en artifact GitHub Actions."
          echo "Local: gunzip -c credit-scoring-api-ci.tar.gz | docker load"
          echo "Puis: docker run --rm -p 8001:8000 credit-scoring-api:ci"
